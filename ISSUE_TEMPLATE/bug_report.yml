name: Bug report
description: Something isn't working as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app's About window.
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Fedora 45, Ubuntu 26.04, …
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install the app?
      options:
        - Flathub
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Drag images here, or paste terminal output.
